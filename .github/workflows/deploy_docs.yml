name: Deploy Docs

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy_docs.yml'
      - 'docs/**'
      - 'include/**'
  workflow_dispatch:

jobs:
  deploy_docs:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: lukka/get-cmake@v4.5.1
        with:
          cmakeVersion: 4.5.1
          ninjaVersion: 1.13.2

      - uses: ssciwr/doxygen-install@v2.0.3
        with:
          version: 1.18.0

      - name: Install Poxy
        run: sudo pip install poxy --break-system-packages

      - name: Configure CMake
        run: cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }} -DBETHUTIL_BUILD_DOCS=ON -DBETHUTIL_BUILD_SRC=OFF -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --target docs

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          force_orphan: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/build/docs/html/
